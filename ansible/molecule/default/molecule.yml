# SPDX-License-Identifier: 0BSD
#
# T-38: a throwaway systemd host, provisioned and deployed by the `polls` role,
# then checked for idempotence and a clean `--check`, with SECRET_KEY, the
# database and the audit log untouched by the repeat runs.
#
# Driver: docker. The daemon is present on every CI runner and running the
# daemon as root sidesteps the unprivileged-userns AppArmor restriction. To run
# rootless with podman, or on another Debian release, see molecule/README.md.
#
# Image: geerlingguy's Debian systemd images are built for exactly this — PID 1
# is systemd, so `systemctl` works inside the container and the role's assertion
# that the target is Debian (roles/polls/tasks/main.yml) holds.

dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: polls-t38
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  env:
    # The scenario lives under ansible/, so MOLECULE_PROJECT_DIRECTORY is
    # ansible/ and the role is one level down.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
  inventory:
    group_vars:
      all:
        polls_release: molecule
        polls_domain: vote.molecule.test
        polls_admin_email: admin@molecule.test
        polls_smoke_test_email: smoke@molecule.test
        polls_scheduler: systemd
        # No real domain and no reachable port 80/443 in the container: the
        # nftables load and the ACME exchange both need a real host.
        polls_manage_firewall: false
        polls_enable_tls: false
        # No MTA in the container, so the smoke play still runs sendtestemail
        # and reports the result but does not fail the deploy on it.
        polls_smoke_require_mail: false
  playbooks:
    converge: converge.yml
    verify: verify.yml

scenario:
  # `idempotence` is the heart of T-38: molecule runs converge a second time and
  # fails if any task reports `changed`. A regenerated SECRET_KEY, a re-run
  # migration or a rewritten env file would all trip it. `verify` then adds the
  # explicit `--check` run and the artefact assertions.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
