# SPDX-License-Identifier: 0BSD
#
# Not a dependency of the `polls` role itself — molecule.yml disables galaxy
# dependency resolution (dependency.enabled: false) so this file is never
# consulted by molecule. It exists for CI to install ahead of `molecule test`:
# the docker driver's own bundled create.yml/destroy.yml (in molecule-plugins,
# not this repo) call community.docker.docker_container, and ansible-core
# ships no collections of its own.
collections:
  - name: community.docker
    version: "5.3.0"
