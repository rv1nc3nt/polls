# SPDX-License-Identifier: 0BSD
- name: Assert the supported target
  # Narrow support is a feature: a playbook claiming four distributions and
  # tested on none is worse than one that refuses to run on anything else (§15).
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
    fail_msg: >-
      This playbook supports current Debian stable only. Other platforms are
      served by contrib/init/, installation by hand, best effort.
  tags: [always]

- name: Provision the host (§15 steps 1, 2, 7)
  ansible.builtin.import_tasks: provision.yml
  tags: [provision]
- name: Deploy the application (§15 steps 3 to 6)
  ansible.builtin.import_tasks: deploy.yml
  tags: [deploy]
- name: Configure backups (§15 step 8)
  ansible.builtin.import_tasks: backup.yml
  tags: [backup]
- name: Run the smoke play (§15 step 9)
  ansible.builtin.import_tasks: smoke.yml
  tags: [smoke, deploy]
