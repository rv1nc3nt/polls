# SPDX-License-Identifier: 0BSD
# Put a `VACUUM INTO` snapshot back in place as the live database, restore the
# media archive taken alongside it, reconcile the schema with the deployed
# code, and hand it all to the service. Imported by ansible/restore.yml between
# the deploy and the smoke play; never part of site.yml.
#
# The audit log is immutable (INV-3) and rides along inside the file untouched —
# the whole point of the exercise is that it comes back with every row (T-16).
# A snapshot can predate the running code, so `migrate` runs after the copy: a
# restore that skipped it would boot the application against an older schema.

- name: Choose the snapshot to restore
  when: polls_restore_from | default('') | length == 0
  block:
    - name: List the snapshots under the backup directory
      ansible.builtin.find:
        paths: "{{ polls_backup_dir }}"
        patterns: "db-*.sqlite3"
        file_type: file
      register: polls_restore_candidates

    - name: Fail when there is nothing to restore
      ansible.builtin.fail:
        msg: >-
          No snapshot matching db-*.sqlite3 under {{ polls_backup_dir }}. Pass
          -e polls_restore_from=/path/to/snapshot, or place one there first.
      when: polls_restore_candidates.matched | int == 0

    - name: Take the most recent snapshot by modification time
      ansible.builtin.set_fact:
        polls_restore_from: "{{ (polls_restore_candidates.files | sort(attribute='mtime') | last).path }}"

- name: Confirm the chosen snapshot is a readable file
  ansible.builtin.stat:
    path: "{{ polls_restore_from }}"
  register: polls_restore_stat

- name: Fail when the chosen snapshot is missing
  ansible.builtin.fail:
    msg: "Snapshot {{ polls_restore_from }} does not exist."
  when: not polls_restore_stat.stat.exists

- name: Verify the snapshot's integrity before trusting it
  # Installing a corrupt file is worse than a failed restore: the damage only
  # surfaces later, against the audit log (§15).
  ansible.builtin.command:
    cmd: sqlite3 {{ polls_restore_from | quote }} "PRAGMA integrity_check"
  register: polls_restore_integrity
  changed_when: false
  failed_when: (polls_restore_integrity.stdout | trim) != "ok"

- name: Derive the matching media archive from the chosen snapshot
  # polls-backup writes db-<stamp>.sqlite3 and media-<stamp>.tar.gz side by
  # side with the same stamp; -e polls_restore_media_from overrides this for
  # a snapshot pair that was renamed or copied out of the backup directory.
  # polls_restore_media_from defaults to "" (defaults/main.yml), not undefined,
  # so `| default(...)` would never fire here — an explicit emptiness check is
  # needed instead.
  ansible.builtin.set_fact:
    polls_restore_media_from: >-
      {{ (polls_restore_from | dirname) + '/' +
         (polls_restore_from | basename | regex_replace('^db-(.*)\.sqlite3$', 'media-\1.tar.gz')) }}
  when: polls_restore_media_from | default('') | length == 0

- name: Check whether a matching media archive exists
  ansible.builtin.stat:
    path: "{{ polls_restore_media_from }}"
  register: polls_restore_media_stat

- name: Stop the web service while the database file is swapped
  ansible.builtin.systemd_service:
    name: polls.service
    state: stopped
  failed_when: false

- name: Set aside the pre-restore database, if one is present
  ansible.builtin.command:
    cmd: >-
      mv {{ polls_state_dir }}/db.sqlite3
      {{ polls_state_dir }}/db.sqlite3.pre-restore-{{ ansible_date_time.iso8601_basic_short }}
    removes: "{{ polls_state_dir }}/db.sqlite3"

- name: Drop any stale WAL and SHM sidecars
  ansible.builtin.file:
    path: "{{ polls_state_dir }}/{{ item }}"
    state: absent
  loop:
    - db.sqlite3-wal
    - db.sqlite3-shm

- name: Put the snapshot in place as the live database
  ansible.builtin.copy:
    src: "{{ polls_restore_from }}"
    dest: "{{ polls_state_dir }}/db.sqlite3"
    remote_src: true
    owner: "{{ polls_user }}"
    group: "{{ polls_group }}"
    mode: "0640"

- name: Set aside the pre-restore media directory, if one is present
  ansible.builtin.command:
    cmd: >-
      mv {{ polls_state_dir }}/media
      {{ polls_state_dir }}/media.pre-restore-{{ ansible_date_time.iso8601_basic_short }}
    removes: "{{ polls_state_dir }}/media"
  when: polls_restore_media_stat.stat.exists

- name: Extract the media archive from the backup
  # R-3.12: option images, the commune logo and favicon. tar was run as
  # {{ polls_user }} at backup time and is extracted as root here, which
  # preserves the original owner and mode from the archive.
  ansible.builtin.unarchive:
    src: "{{ polls_restore_media_from }}"
    dest: "{{ polls_state_dir }}"
    remote_src: true
  when: polls_restore_media_stat.stat.exists

- name: Warn when the chosen snapshot has no matching media archive
  ansible.builtin.debug:
    msg: >-
      No media archive at {{ polls_restore_media_from }} — option images, the
      commune logo and favicon (R-3.12) are not restored. Backups taken
      before this feature was added have no media-*.tar.gz; the database
      itself is unaffected.
  when: not polls_restore_media_stat.stat.exists

- name: Reconcile the restored schema with the deployed code
  # Mirrors deploy.yml step 4's environment; DJANGO_SECRET_KEY is a placeholder
  # because migrate signs nothing.
  ansible.builtin.command:
    cmd: "{{ polls_prefix }}/current/.venv/bin/python manage.py migrate --no-input"
    chdir: "{{ polls_prefix }}/current"
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DJANGO_SECRET_KEY: build-step-not-used-for-signing
    DJANGO_ALLOWED_HOSTS: "{{ polls_domain }},127.0.0.1,localhost"
    DJANGO_DB_PATH: "{{ polls_state_dir }}/db.sqlite3"
    DJANGO_PUBLIC_BASE_URL: "https://{{ polls_domain }}"
    DJANGO_EMAIL_HOST: "{{ polls_email_host }}"
    DJANGO_JOB_LOCK_DIR: "{{ polls_state_dir }}/locks"
    PYTHONPATH: "{{ polls_prefix }}/current/src"
  become: true
  become_user: "{{ polls_user }}"
  register: polls_restore_migrate
  changed_when: "'Applying' in polls_restore_migrate.stdout"

- name: Start the web service on the restored database
  ansible.builtin.systemd_service:
    name: polls.service
    state: started

- name: Report what was restored
  ansible.builtin.debug:
    msg: >-
      Restored {{ polls_state_dir }}/db.sqlite3 from {{ polls_restore_from }}
      ({{ 'schema migrated' if polls_restore_migrate.changed else 'schema already current' }}).
      {{ 'Restored ' + polls_state_dir + '/media from ' + polls_restore_media_from + '.'
         if polls_restore_media_stat.stat.exists else 'No media archive was restored (see warning above).' }}
      The previous database and media directory, if any, are kept beside them
      as db.sqlite3.pre-restore-* and media.pre-restore-*.
