# SPDX-License-Identifier: 0BSD
# Part of the deliverable, not an afterthought (§15): provision a fresh host,
# deploy the code, restore the most recent backup, run the same smoke play. A
# backup procedure that has never been restored is not a backup procedure — and
# for a system whose credibility rests on an audit log, losing that log to an
# untested restore would be the worst possible failure (T-16).
#
#   ansible-playbook -i inventory.ini restore.yml
#   ansible-playbook -i inventory.ini restore.yml -e polls_restore_from=/var/backups/polls/db-20260901T031700Z.sqlite3
#
# With no -e, restore.yml takes the newest db-*.sqlite3 under polls_backup_dir.
# provision and deploy are idempotent, so running this against a host that is
# merely damaged rather than lost is safe: only the database file is replaced.
- name: Restore an instance from its most recent backup
  hosts: polls
  become: true
  tasks:
    - name: Provision the host (§15 steps 1, 2, 7)
      ansible.builtin.import_role:
        name: polls
        tasks_from: provision.yml

    - name: Deploy the application (§15 steps 3 to 6)
      ansible.builtin.import_role:
        name: polls
        tasks_from: deploy.yml

    - name: Restore the database from a snapshot
      ansible.builtin.import_role:
        name: polls
        tasks_from: restore.yml

    - name: Run the smoke play (§15 step 9)
      ansible.builtin.import_role:
        name: polls
        tasks_from: smoke.yml
