; Copy to inventory.ini and edit. Secrets come from ansible-vault, never here.
[polls]
vote.exemple-commune.fr

[polls:vars]
polls_domain=vote.exemple-commune.fr
polls_admin_email=mairie@exemple-commune.fr
polls_smoke_test_email=informatique@exemple-commune.fr
; The deploy fails if the smoke test email does not send (§15 step 9). Set
; polls_smoke_require_mail=false only to stand up a host before its relay exists.
polls_scheduler=cron
; Polls whose espace mairie shows the trend screen: their ids, comma-separated,
; no quotes or brackets. Leave unset for none.
;polls_trend_polls=a71b5307-fbe5-4bd8-a8ec-e4038bb56e7d
