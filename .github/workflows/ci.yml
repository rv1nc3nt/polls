# SPDX-License-Identifier: 0BSD
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # The fast job: unit tests, lint and types on every commit (§12.1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # A hand-edited .po is only found to be malformed when something compiles
      # it; the runner has gettext, the developer's machine may not (§3.8).
      - run: sudo apt-get install -y gettext
      - run: uv run python manage.py compilemessages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -q

  verifier:
    # T-10: the Rust verifier must agree with the Python tally on fixtures
    # including the cyclic case of T-9. When they disagree, return to the
    # specification and determine which is wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cargo test --manifest-path verifier/Cargo.toml
      - run: uv sync --frozen
      - run: uv run pytest tests/integration/test_verifier_agreement.py -q

  services:
    # T-50: service definitions under contrib/init/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ExecStart points into /opt/polls, which exists only once the playbook
      # has run; tests/integration/test_init_scripts.py tolerates exactly this
      # diagnostic and no other, so this step does the same.
      - name: systemd-analyze verify contrib/init/polls.service
        run: |
          real="$(systemd-analyze verify contrib/init/polls.service 2>&1 1>/dev/null \
            | grep -v 'is not executable: No such file or directory' || true)"
          if [ -n "$real" ]; then
            printf '%s\n' "$real"
            exit 1
          fi
      - run: shellcheck contrib/init/polls.openrc contrib/init/polls.rc.freebsd contrib/init/polls.rc.openbsd

  molecule:
    # The slow job: T-38 (deploy is idempotent and --check clean, SECRET_KEY /
    # database / audit log untouched) and T-16 (a backup restores with its
    # audit log whole and its closure hash still recomputing). A throwaway
    # systemd container, not the ordinary test database — see
    # ansible/molecule/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Molecule and the container driver
        run: pip install "molecule-plugins[docker]" molecule ansible-core
      # molecule-plugins' own create.yml/destroy.yml (not this repo's) drive
      # the container through community.docker.docker_container; ansible-core
      # ships no collections, so without this the destroy step at the end of
      # `dependency, cleanup, destroy, ...` fails before anything else runs.
      - name: Install Ansible collections for the docker driver
        run: ansible-galaxy collection install -r ansible/requirements.yml
      # Docker is already running on the runner; no daemon setup needed.
      - name: T-38 — deploy idempotence and --check
        working-directory: ansible
        # --debug: molecule's default error handler collapses a driver/docker
        # exception down to a bare "Error:" with no body, which is useless in
        # CI where nobody can rerun it interactively to see more (§15).
        run: molecule --debug test -s default
      - name: T-16 — backup and restore round trip
        working-directory: ansible
        run: molecule --debug test -s restore
