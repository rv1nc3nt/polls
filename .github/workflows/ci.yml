# SPDX-License-Identifier: 0BSD
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # The fast job: unit tests, lint and types on every commit (§12.1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # A hand-edited .po is only found to be malformed when something compiles
      # it; the runner has gettext, the developer's machine may not (§3.8).
      - run: sudo apt-get install -y gettext
      - run: uv run python manage.py compilemessages
      # A model field edited without regenerating its migration passes every
      # other gate here (SQLite is rebuilt from models for tests) and is only
      # caught by ansible/roles/polls/tasks/deploy.yml's own --check, i.e. at
      # deploy time. Catch it here instead.
      - run: uv run python manage.py makemigrations --check --dry-run
      # Django's deployment checklist under the production settings, failing on
      # any warning (review A-2). The three this project answers otherwise are
      # silenced in the settings, each with its reason; the values below exist
      # only so prod.py loads.
      - run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-check-deploy-only-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: polls.example.org
          DJANGO_PUBLIC_BASE_URL: https://polls.example.org
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      # test_verifier_agreement.py builds the verifier: with the compiler
      # rust-toolchain.toml pins, installed explicitly rather than trusting
      # rustup's auto-install, whose default has changed between versions.
      - run: rustup toolchain install
      - run: uv run pytest -q

  verifier:
    # T-10: the Rust verifier must agree with the Python tally on fixtures
    # including the cyclic case of T-9. When they disagree, return to the
    # specification and determine which is wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: rustup toolchain install  # the one rust-toolchain.toml pins
      # fmt and clippy as gates, like ruff on the Python side: the verifier is
      # the part a sceptic reads, so it is held to its own linter too.
      - run: cargo fmt --manifest-path verifier/Cargo.toml --all --check
      - run: cargo clippy --manifest-path verifier/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path verifier/Cargo.toml
      - run: uv sync --frozen
      - run: uv run pytest tests/integration/test_verifier_agreement.py -q
      # The shared corpus on both sides, then 5000 random polls on a seed of
      # this run's own (review D-2): the plain test run covers the fixed
      # default seed, this one explores. A failure prints the seed.
      - run: >-
          uv run pytest -q tests/integration/test_vectors.py
          tests/integration/test_differential.py
          tests/integration/test_independent_schulze.py
        env:
          POLLS_DIFFERENTIAL_SEED: ${{ github.run_id }}
          POLLS_DIFFERENTIAL_CASES: "5000"

  frontend:
    # ESLint and stylelint over src/static/ (review C-8). package.json holds
    # only these tools: the site serves its scripts and stylesheet as written.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  browser:
    # tests/browser (review C-8): a voter's journey, the back-office editor
    # and every main page type (review C-3) in headless Chromium against the live test server, each page checked for
    # script errors, CSP violations and axe-core's WCAG 2.2 AA rules. The HTTP
    # tests cannot see any of the three; the Origin a browser sends broke
    # every ballot without one of them failing (decision log #50).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: npm ci  # axe-core
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: uv run pytest -q -m browser

  services:
    # T-50: service definitions under contrib/init/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ExecStart points into /opt/polls, which exists only once the playbook
      # has run; tests/integration/test_init_scripts.py tolerates exactly this
      # diagnostic and no other, so this step does the same.
      - name: systemd-analyze verify contrib/init/polls.service
        run: |
          real="$(systemd-analyze verify contrib/init/polls.service 2>&1 1>/dev/null \
            | grep -v 'is not executable: No such file or directory' || true)"
          if [ -n "$real" ]; then
            printf '%s\n' "$real"
            exit 1
          fi
      - run: shellcheck contrib/init/polls.openrc contrib/init/polls.rc.freebsd contrib/init/polls.rc.openbsd

  molecule:
    # The slow job: T-38 (deploy is idempotent and --check clean, SECRET_KEY /
    # database / audit log untouched) and T-16 (a backup restores with its
    # audit log whole and its closure hash still recomputing). A throwaway
    # systemd container, not the ordinary test database — see
    # ansible/molecule/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Molecule and the container driver
        run: pip install "molecule-plugins[docker]" molecule ansible-core
      # molecule-plugins' own create.yml/destroy.yml (not this repo's) drive
      # the container through community.docker.docker_container; ansible-core
      # ships no collections, so without this the destroy step at the end of
      # `dependency, cleanup, destroy, ...` fails before anything else runs.
      - name: Install Ansible collections for the docker driver
        run: ansible-galaxy collection install -r ansible/requirements.yml
      # Docker is already running on the runner; no daemon setup needed.
      - name: T-38 — deploy idempotence and --check
        working-directory: ansible
        # --debug: molecule's default error handler collapses a driver/docker
        # exception down to a bare "Error:" with no body, which is useless in
        # CI where nobody can rerun it interactively to see more (§15).
        run: molecule --debug test -s default
      - name: T-16 — backup and restore round trip
        working-directory: ansible
        run: molecule --debug test -s restore
