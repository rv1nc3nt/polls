# SPDX-License-Identifier: 0BSD
name: Verifier release binaries

# The verifier is deliberately independent of the Python tally (§8, §9) and is
# meant to be run by anyone auditing a poll, not just people with a Rust
# toolchain — so every project release gets prebuilt binaries attached for the
# desktop platforms someone might audit from, alongside the source tag.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_artifact: polls-verifier-linux-x86_64
            gui_artifact: polls-verifier-gui-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_artifact: polls-verifier-windows-x86_64.exe
            gui_artifact: polls-verifier-gui-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            cli_artifact: polls-verifier-macos-aarch64
            gui_artifact: polls-verifier-gui-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            cli_artifact: polls-verifier-macos-x86_64
            gui_artifact: polls-verifier-gui-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --manifest-path verifier/Cargo.toml --target ${{ matrix.target }}
      - run: cargo build --manifest-path verifier/Cargo.toml --release --target ${{ matrix.target }}
      - name: Rename binaries to their published artifact names
        shell: bash
        run: |
          dir=verifier/target/${{ matrix.target }}/release
          cli="$dir/polls-verifier"
          gui="$dir/polls-verifier-gui"
          [ -f "$cli.exe" ] && cli="$cli.exe"
          [ -f "$gui.exe" ] && gui="$gui.exe"
          cp "$cli" "${{ matrix.cli_artifact }}"
          cp "$gui" "${{ matrix.gui_artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cli_artifact }}
          path: ${{ matrix.cli_artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gui_artifact }}
          path: ${{ matrix.gui_artifact }}

  attach:
    # workflow_dispatch has no release to attach to; that path is for
    # rebuilding/inspecting the binaries without touching a release.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
